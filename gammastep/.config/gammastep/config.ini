[general]
temp-day=5700
temp-night=3500
brightness-day=1.0
brightness-night=0.85
fade=1
adjustment-method=wayland
location-provider=manual

[manual]
# Rounded on purpose: this file is in a public repo, and sunset time is
# insensitive to precision — a degree of longitude is four minutes of solar
# time, so one decimal is within a minute of exact and discloses a region
# rather than a town.
lat=49.0
lon=8.6
