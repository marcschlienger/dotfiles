[general]
temp-day=5700
temp-night=3500
brightness-day=1.0
brightness-night=0.85
fade=1
adjustment-method=wayland
location-provider=manual

[manual]
# Rounded on purpose: this file is in a public repo, and sunset time is
# insensitive to precision — rounding to a whole degree moves sunrise and sunset
# by at most about two minutes per coordinate (four in the worst case), and the
# coordinates describe a region rather than a town.
lat=49.0
lon=9.0
