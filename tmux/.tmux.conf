# Setting the prefix from C-b to C-a / C-Space
set -g prefix C-a
#set -g prefix C-Space
unbind C-b

# Ensure that we can send Ctrl-A to other apps
bind C-a send-prefix
#bind C-Space send-prefix

# Setting the delay between prefix and command
set -s escape-time 1

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# jeload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# plitting panes with s and v
bind s split-window -h
bind v split-window -v

# Moving between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick window selection 
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resizing panes with Prefix H,J,K,L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse support - set to off if you do not want to use the mouse
set -g mouse on

# Avoid ESC delay
set -s escape-time 0


# Improve colors



# Set the default terminal mode to 256color mode
set -s default-terminal "tmux-256color"
set -ga terminal-overrides ",*-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -ga terminal-overrides ",alacritty:RGB"

set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Set the window status
setw -g window-status-activity-style fg=white,bold,bg=red
setw -g window-status-current-format " #I#{?window_zoomed_flag,+,}:#W "
setw -g window-status-current-style fg=cyan,bold,bg=black
setw -g window-status-format " #I#{?window_zoomed_flag,+,}:#W "
setw -g window-status-style fg=magenta,bg=default
setw -g window-status-separator ""

# Window status on the left side of the status line
set -g status-justify absolute-centre

# Set the colors for pane borders
setw -g pane-active-border-style fg=yellow,bg=black
setw -g pane-border-style fg=black,bg=black
setw -g pane-border-indicators colour
setw -g pane-border-lines single

# Set the colors for the panes
setw -g window-style fg=default,bg=default
setw -g window-active-style fg=terminal,bg=terminal

# Window mode style
setw -g mode-style fg=yellow,bold,bg=black

# Command / message line
set -g message-style fg=orange,bold,bg=black

# Set the colors of the status line
set -g status-style fg=magenta,bg=default
set -g status-position top

# Status line right side
set -g status-left " § #S "
set -g status-left-length 40
set -g status-left-style fg=yellow,bg=black

# Status line left side
set -g status-right " %B %d, %Y  %R "
set -g status-right-length 40
set -g status-right-style fg=white,bg=black

# Update the status line every sixty seconds
set -g status-interval 60

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Enable vi keys
setw -g mode-keys vi

# Copy mode (enter copy mode with PREFIX+[)
#set -s copy-command 'xsel --clipboard'
set -s copy-command 'xclip -selection clipboard'
set -s set-clipboard off

bind -Tcopy-mode-vi 'v' send -X begin-selection
bind -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi Enter send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind P paste-buffer

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'junegunn/tmux-fzf-url'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# To install plugins: PREFIX+SHIFT+i
run -b ~/.tmux/plugins/tpm/tpm"
