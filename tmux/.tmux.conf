# Setting the prefix from C-b to C-Space
set -g prefix C-Space
unbind C-b

# Press the prefix twice to send Ctrl-Space to the active pane
bind C-Space send-prefix

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Splitting panes horizontally and vertically
bind | split-window -h
bind - split-window -v

# Moving between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick window selection 
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resizing panes with Prefix H,J,K,L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Some keybindings without Prefix for convenience
bind -n M-r source-file ~/.tmux.conf \; display "Reloaded!"
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-d detach
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-x command-prompt
bind -n M-z resize-pane -Z
# Option+Shift+arrows
bind -n S-M-Left previous-window
bind -n S-M-Right next-window
# split panes using | and - (I borrowed this idea from someone -- the defaults are incomprehensible to me)
bind -n M-| split-window -h
bind -n M-- split-window -v
unbind '"'
unbind %

# Mouse support - set to off if you do not want to use the mouse
set -g mouse on

# Avoid ESC delay
set -s escape-time 0

# Improve colors
# Set the default terminal mode to 256color mode
set -s default-terminal "tmux-256color"
set -ga terminal-overrides ",*-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -ga terminal-overrides ",alacritty:RGB"

set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Set the window status
setw -g window-status-separator ""
setw -g window-status-style fg=orange,bold,italics,bg=default
setw -g window-status-format " #I#{?window_zoomed_flag,+,}:#W "
setw -g window-status-current-style fg=black,bold,bg=orange
setw -g window-status-current-format " #I#{?window_zoomed_flag,+,}:#W "

# Window status on the left side of the status line
set -g status-justify left 

# Set the colors for pane borders
setw -g pane-border-style fg=default,bg=default
setw -g pane-active-border-style fg=orange,bg=default
setw -g pane-border-indicators colour
setw -g pane-border-lines single
set-option -g pane-border-status bottom
set-option -g pane-border-format "#{?$IS_COPY_MODE,$COPY_MODE_LEFT$COPY_MODE_CENTER$COPY_MODE_RIGHT,}"

# Set the colors for the panes
setw -g window-style fg=default,bg=default
setw -g window-active-style fg=default,bg=default

# Window mode style
setw -g mode-style fg=yellow,bold,bg=black

# Command / message line
set -g message-style fg=orange,bold,bg=black

# Set the colors of the status line
set -g status-style fg=magenta,bg=default
set -g status-position bottom 

# Status line right side
set -g status-left-length 40
set -g status-left "#[fg=orange,bold,italics,bg=default] #S #[fg=cyan,bg=default]§#[default] "

# Status line left side
set -g status-right-length 40
set-option -g status-right "#[fg=orange,bold,italics]$USER#[fg=cyan,bg=default]@#[fg=orange,bold,italics]#{host_short} #[fg=magenta]%R #[default]"

# Update the status line every sixty seconds
set -g status-interval 60

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Enable vi keys
setw -g mode-keys vi

# Copy mode (enter copy mode with PREFIX+[). Use the native clipboard command
# available on macOS or a Wayland session, and otherwise retain tmux's buffer.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'set -s copy-command pbcopy' \
    'if-shell "command -v wl-copy >/dev/null 2>&1" "set -s copy-command wl-copy"'
set -s set-clipboard external

set-option -g allow-passthrough on

bind -Tcopy-mode-vi 'v' send -X begin-selection
bind -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi Enter send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind P paste-buffer

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'junegunn/tmux-fzf-url'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# To install plugins: PREFIX+SHIFT+i
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
    'run-shell -b "$HOME/.tmux/plugins/tpm/tpm"'
